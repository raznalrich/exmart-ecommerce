<div class="confirmation-dialog">
  <div class="dialog-header">
    <h2>Confirm Upload</h2>
  </div>
  <div class="dialog-content">
    <p><strong>Are you sure you want to process "{{ data.fileName }}"?</strong></p>
    <p style="color:red">This will update the order statuses in the table.</p>
  </div>
  <div class="dialog-actions">
    <button class="btn-secondary" (click)="onCancel()">Cancel</button>
    <button class="btn-primary" (click)="onConfirm()">Continue</button>
  </div>
</div>
